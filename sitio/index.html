<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aprende con Dino</title>
<link rel="icon" type="image/png" href="favicon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Mundo único, oscuro: el gris del estudio donde vive Dino + paleta del brandbook.
     Layout: columna de teléfono centrada, tarjetas flotantes de esquinas muy redondas, mapa en zigzag. */
  color-scheme: dark;
  --bg:#2b2b2c; --panel:#38383a; --panel-2:#444447; --line:#56565a;
  --ink:#f6f1ec; --muted:#b9b3ad;
  --naranja:#fc5e31; --azul:#2054e5; --amarillo:#e8c348; --verde:#6ac460; --morado:#3917a8; --morado-claro:#8f73f2;
  --display:"Helvetica Neue Condensed","HelveticaNeue-CondensedBold","Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Helvetica Neue","Barlow",Helvetica,Arial,sans-serif;
  --r:22px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.2px);background-size:14px 14px}
button{font:inherit;color:inherit;cursor:pointer}
img{max-width:100%;display:block}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:.01em;line-height:1.05;margin:0;text-wrap:balance;text-transform:uppercase}
h1{font-size:2.3rem} h2{font-size:1.7rem} h3{font-size:1.25rem}
p{margin:0}
.app{max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:0 16px 24px}
header{display:flex;align-items:center;gap:10px;padding:14px 0;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
.logo{width:38px;height:38px;flex:none}
.brand{font-family:var(--display);font-weight:800;font-size:1.25rem;text-transform:uppercase;margin-right:auto}
.pill{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:600;font-size:.9rem;font-variant-numeric:tabular-nums}
.pill i{width:10px;height:10px;border-radius:50%;display:block}
main{flex:1;display:flex;flex-direction:column;gap:18px;padding-top:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.foto{border-radius:var(--r);overflow:hidden;background:#333;border:1px solid var(--line)}
.foto img{width:100%}
.muted{color:var(--muted);font-size:.92rem}
.btn{border:0;border-radius:16px;padding:14px 18px;font-family:var(--display);font-weight:800;font-size:1.2rem;text-transform:uppercase;letter-spacing:.03em;background:var(--naranja);color:#1c0c05;box-shadow:0 4px 0 #b53b17;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b53b17}
.btn[disabled]{background:var(--panel-2);color:var(--muted);box-shadow:none;cursor:not-allowed}
.btn.sec{background:transparent;border:2px solid var(--line);color:var(--ink);box-shadow:none;font-size:1rem;padding:10px 14px}
:focus-visible{outline:3px solid var(--amarillo);outline-offset:2px}
label{font-weight:600}
input[type=email]{width:100%;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:13px 14px;color:var(--ink);font:inherit}
.err{color:var(--amarillo);font-size:.9rem;min-height:1.2em}
.bubble{background:var(--ink);color:#231f1c;border-radius:var(--r);padding:14px 16px;font-weight:500;position:relative}
.bubble b{color:#c43d12}
.dino-row{display:flex;gap:12px;align-items:flex-end}
.dino-row .cara{width:64px;height:64px;border-radius:50%;flex:none;border:3px solid var(--naranja)}
.dino-row .bubble{flex:1;border-bottom-left-radius:6px}
/* opciones */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:13px 14px;font-weight:500}
.opt:hover{border-color:var(--muted)}
.opt.ok{border-color:var(--verde);background:rgba(106,196,96,.15)}
.opt.mal{border-color:var(--amarillo);background:rgba(232,195,72,.12);animation:shake .3s}
.opt .n{display:inline-block;min-width:1.6em;font-family:var(--display);font-weight:800;color:var(--naranja)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.barra{height:10px;background:var(--panel-2);border-radius:99px;overflow:hidden}
.barra span{display:block;height:100%;background:var(--naranja);border-radius:99px;transition:width .3s}
.eyebrow{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:.95rem;color:var(--naranja)}
/* mapa */
.mundo{border-radius:var(--r);border:1px solid var(--line);background:var(--panel);overflow:hidden}
.mundo-head{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;color:#fff}
.mundo-head span{font-size:.85rem;font-weight:600;background:rgba(0,0,0,.28);padding:3px 10px;border-radius:99px;white-space:nowrap}
.ruta{position:relative;height:390px}
.ruta>svg{position:absolute;inset:0;width:100%;height:100%}
.nodo{position:absolute;transform:translate(-50%,-50%);width:68px;height:68px;border-radius:50%;border:0;display:grid;place-items:center;
  font-family:var(--display);font-weight:800;font-size:1.5rem;background:var(--panel-2);color:var(--muted);box-shadow:0 6px 0 rgba(0,0,0,.35)}
.nodo.hecho{background:var(--c);color:#fff}
.nodo.hoy{background:var(--naranja);color:#1c0c05;animation:pulso 1.6s infinite}
.nodo.espera{background:var(--panel-2);color:var(--amarillo);border:3px dashed var(--amarillo)}
.nodo img{position:absolute;top:-46px;left:50%;transform:translateX(-50%);width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);max-width:none}
@keyframes pulso{0%{box-shadow:0 6px 0 rgba(0,0,0,.35),0 0 0 0 rgba(252,94,49,.6)}100%{box-shadow:0 6px 0 rgba(0,0,0,.35),0 0 0 18px rgba(252,94,49,0)}}
.rot{position:absolute;transform:translateY(-50%);font-size:.88rem;line-height:1.25;max-width:46%}
.rot b{display:block;font-family:var(--display);font-size:1.1rem;text-transform:uppercase}
.rot small{color:var(--muted)}
.demo{border:1px dashed var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.demo div{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.orden{display:flex;flex-direction:column;gap:8px;min-height:40px}
.orden div{background:rgba(106,196,96,.15);border:2px solid var(--verde);border-radius:14px;padding:10px 12px}
.premio{display:flex;gap:10px}
.premio div{flex:1;background:var(--bg);border-radius:16px;padding:12px;text-align:center}
.premio b{display:block;font-family:var(--display);font-size:2rem;color:var(--naranja);font-variant-numeric:tabular-nums}
footer{margin-top:24px;color:var(--muted);font-size:.8rem;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.escena{display:flex;flex-direction:column;gap:10px}
.linea{display:flex;gap:10px;align-items:flex-end;animation:entra .25s}
.linea img{width:44px;height:44px;border-radius:50%;border:2px solid var(--naranja);flex:none}
.linea .bubble{max-width:82%;padding:10px 14px}
.linea .bubble small{display:block;font-family:var(--display);font-weight:800;text-transform:uppercase;color:#c43d12;letter-spacing:.05em}
.linea.tu{justify-content:flex-end}
.linea.tu .bubble{background:var(--azul);color:#fff;border-bottom-right-radius:6px}
.linea.tu .bubble small{color:#cfdcff}
.linea.acto{justify-content:center;color:var(--muted);font-style:italic;font-size:.9rem;text-align:center}
@keyframes entra{from{transform:translateY(8px);opacity:.3}}
.moraleja{border:2px solid var(--naranja);border-radius:var(--r);padding:14px 16px;font-weight:600}
.pares{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pares>div{display:flex;flex-direction:column;gap:10px;min-width:0}
.pares .opt{flex:1;font-size:.93rem;overflow-wrap:anywhere}
.opt.sel{border-color:var(--naranja);background:rgba(252,94,49,.15)}
.hueco{display:inline-block;min-width:70px;border-bottom:3px solid var(--naranja);text-align:center;color:var(--naranja);font-weight:700}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dos .opt{text-align:center;font-family:var(--display);font-weight:800;font-size:1.2rem;text-transform:uppercase}
.armado{background:var(--bg);border:2px dashed var(--line);border-radius:16px;padding:12px 14px;min-height:56px;font-size:.95rem}
.armado span{display:block;margin-bottom:4px}.armado b{color:var(--naranja)}

/* --- v1.2: Dino recortado y animado --- */
.dino-hero.mini img{max-height:70px;animation:none}
.dino-hero{display:flex;justify-content:center;padding-top:8px}
.dino-hero img{max-height:240px;width:auto;filter:drop-shadow(0 14px 18px rgba(0,0,0,.45));animation:entra .5s cubic-bezier(.2,1.4,.4,1) both, flota 3.2s ease-in-out .5s infinite}
@keyframes entra{from{transform:translateY(40px) scale(.85);opacity:0}}
@keyframes flota{50%{transform:translateY(-6px) rotate(-1.5deg)}}
.dino-hero.salta img{animation:entra .5s both, salto .7s ease-in-out .5s 3}
@keyframes salto{40%{transform:translateY(-34px) rotate(4deg) scale(1.03)}70%{transform:translateY(0) scale(.97,1.03)}}
.dino-row .cara{animation:entra .4s both}
.dino-row.habla .cara{animation:charla .35s ease-in-out infinite alternate}
@keyframes charla{to{transform:translateY(-3px) rotate(-4deg) scale(1.04)}}
.dino-row.sacude .cara{animation:sacude .45s}
@keyframes sacude{20%,60%{transform:translateX(-7px) rotate(-6deg)}40%,80%{transform:translateX(7px) rotate(6deg)}}
.escenario{height:170px;display:flex;justify-content:center;align-items:flex-end;background:radial-gradient(ellipse at 50% 100%,rgba(252,94,49,.22),transparent 65%);border-radius:var(--r)}
.escenario img{max-height:160px;width:auto;filter:drop-shadow(0 10px 12px rgba(0,0,0,.4))}
.escenario img.pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.8) translateY(14px);opacity:.4}}
.lluvia{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.lluvia i{position:absolute;top:-30px;width:18px;height:18px;border-radius:50%;background:var(--naranja);box-shadow:inset -3px -3px 0 rgba(0,0,0,.18);animation:cae linear forwards}
.lluvia i::after{content:"";position:absolute;top:-5px;right:1px;width:8px;height:5px;border-radius:50%;background:var(--verde);transform:rotate(-30deg)}
@keyframes cae{to{transform:translateY(110vh) rotate(540deg)}}
/* --- v1.2: menú de recompensas --- */
.saldo{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}
.saldo[aria-expanded="true"]{border-color:var(--naranja)}
.moneda{width:22px;height:22px;flex:none}
.menu[hidden]{display:none!important}
.menu{position:absolute;top:calc(100% + 8px);right:0;width:min(400px,calc(100vw - 32px));max-height:min(70vh,560px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 18px 40px rgba(0,0,0,.5);padding:16px;display:flex;flex-direction:column;gap:14px;animation:baja .18s ease-out}
@keyframes baja{from{transform:translateY(-8px);opacity:0}}
.menu h4{margin:0;font-family:var(--display);text-transform:uppercase;font-size:1rem;letter-spacing:.04em;color:var(--naranja)}
.menu .big{font-family:var(--display);font-weight:800;font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
.fila{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.93rem}
.fila b{font-variant-numeric:tabular-nums;white-space:nowrap}
.item{background:var(--bg);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px}
.item .btn{font-size:.95rem;padding:9px 12px;align-self:flex-start}
.ayuda{display:flex;gap:10px;flex-wrap:wrap}
.ayuda .btn{font-size:.9rem;padding:8px 12px}
.opt.tachada{opacity:.35;text-decoration:line-through}
.secretos .linea-sec{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg);border-radius:16px;padding:12px}
.secretos .linea-sec .btn{font-size:.95rem;padding:9px 12px}

/* --- v1.3: mapa con paisaje, cofres, hoja, barra inferior --- */
body.connav .app{padding-bottom:96px}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
#nav[hidden],#hoja[hidden]{display:none}
#nav div{display:flex;width:100%;max-width:460px}
#nav button{flex:1;background:none;border:0;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.74rem;font-weight:600;color:var(--muted)}
#nav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#nav button[aria-current="page"]{color:var(--naranja)}
#nav button[aria-current="page"] svg{fill:rgba(252,94,49,.18)}
#hoja{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom));width:min(428px,calc(100vw - 24px));z-index:14;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 18px 40px rgba(0,0,0,.55);padding:16px;display:flex;flex-direction:column;gap:10px;animation:sube .2s ease-out}
@keyframes sube{from{transform:translate(-50%,16px);opacity:0}}
#hoja .x{position:absolute;top:8px;right:8px;background:none;border:0;color:var(--muted);font-size:1.1rem;padding:6px 10px}
#hoja h3{padding-right:34px}
.ruta{overflow:hidden}
.globo[hidden]{display:none}
.item .fila b:first-child{white-space:normal}
.chip{position:absolute;transform:translateX(-50%);width:140px;text-align:center;background:rgba(30,30,32,.82);color:#fff;border-radius:12px;padding:5px 8px;font-size:.78rem;line-height:1.2;pointer-events:none}
.chip b{display:block;font-family:var(--display);font-size:.98rem;text-transform:uppercase}
.chip small{color:#d8d2cc}
.nodo{z-index:2;border:4px solid rgba(255,255,255,.85)}
.nodo.cerrado{background:#6d6d72;color:#d5d5d8}
.cofre-btn{position:absolute;transform:translate(-50%,-50%);z-index:2;background:none;border:0;padding:0;width:74px;height:66px}
.cofre-btn svg{width:74px;height:66px;filter:drop-shadow(0 6px 0 rgba(0,0,0,.3))}
.cofre-btn.listo{animation:brinca 1.1s ease-in-out infinite}
.cofre-btn.cerrado svg{filter:grayscale(1) brightness(.8) drop-shadow(0 6px 0 rgba(0,0,0,.3))}
.cofre-btn.abierto svg{opacity:.75}
@keyframes brinca{50%{transform:translate(-50%,-58%) rotate(-3deg)}}
.arbol,.decor{position:absolute;transform:translate(-50%,-50%);background:none;border:0;padding:0;z-index:1}
.arbol.mueve{animation:mece .5s}
@keyframes mece{25%{transform:translate(-50%,-50%) rotate(-7deg)}75%{transform:translate(-50%,-50%) rotate(7deg)}}
.dino-mapa{position:absolute;transform:translate(-50%,-50%);z-index:3;background:none;border:0;padding:0}
.dino-mapa img{height:104px;width:auto;filter:drop-shadow(0 8px 6px rgba(0,0,0,.4));animation:flota 3.2s ease-in-out infinite}
.dino-mapa.duerme img{filter:brightness(.7) drop-shadow(0 8px 6px rgba(0,0,0,.4));animation:none}
.dino-mapa .zzz{position:absolute;top:-6px;right:-4px;color:#fff;font-family:var(--display);font-weight:800;animation:zz 2s ease-in-out infinite}
@keyframes zz{50%{transform:translate(6px,-8px);opacity:.4}}
.globo{position:absolute;z-index:4;width:170px;background:var(--ink);color:#231f1c;border-radius:16px;padding:9px 11px;font-size:.84rem;font-weight:500;line-height:1.3;box-shadow:0 6px 14px rgba(0,0,0,.35);transform:translateY(-100%)}
.globo b{color:#c43d12}
.lucier{position:absolute;width:5px;height:5px;border-radius:50%;background:#f6f39a;box-shadow:0 0 8px 3px rgba(246,243,154,.7);animation:parpa 2.4s ease-in-out infinite;z-index:1;pointer-events:none}
@keyframes parpa{50%{opacity:.1;transform:translate(8px,-10px)}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 div{background:var(--bg);border-radius:16px;padding:12px;text-align:center;font-size:.85rem}
.grid2 b{display:block;font-family:var(--display);font-size:1.8rem;color:var(--naranja);font-variant-numeric:tabular-nums}
.guia h3{margin-top:8px;color:var(--naranja)}
.guia ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.seg{display:flex;gap:8px}.seg .btn{flex:1;font-size:.9rem;padding:9px 6px}
.seg .btn[aria-pressed="true"]{border-color:var(--naranja);color:var(--naranja)}

/* --- v1.4: mapa plano, perfil y tienda con color --- */
.mundo.plano{border:0}
.mundo.plano .mundo-head{background:transparent!important;padding-bottom:0}
.mundo.plano .ruta{background:transparent}
.nodo.blob{width:88px;height:82px;border-radius:46% 54% 52% 48%/55% 46% 54% 45%;border:0;background:rgba(255,255,255,.2);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--body);font-size:.74rem;font-weight:700;text-transform:none;box-shadow:0 6px 0 rgba(0,0,0,.14);animation:none}
.nodo.blob:nth-of-type(odd){border-radius:54% 46% 48% 52%/46% 55% 45% 54%}
.nodo.blob svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.nodo.blob.hecho{background:#fff;color:var(--c)}
.nodo.blob.hoy{width:104px;height:96px;background:#ffb020;color:#3a2400;font-size:.9rem;animation:late 1.6s ease-in-out infinite}
.nodo.blob.espera{background:rgba(255,255,255,.12);outline:3px dashed rgba(255,255,255,.7);outline-offset:-3px}
@keyframes late{50%{transform:translate(-50%,-50%) scale(1.06)}}
.tit{position:absolute;transform:translateX(-50%);width:150px;text-align:center;color:#fff;font-weight:700;font-size:.84rem;line-height:1.2;pointer-events:none}
.tit small{display:block;font-weight:500;opacity:.8}
.arbol.plano svg{width:46px;height:46px}
/* perfil */
.hola{display:flex;align-items:center;gap:12px}
.hola img{width:60px;height:60px;border-radius:50%;background:#e9e2ff;border:3px solid #fff}
.hola h2{text-transform:none;font-family:var(--body);font-weight:700;font-size:1.35rem}
.destacada{border-radius:26px;padding:18px;display:flex;align-items:center;gap:10px;color:#fff;background:#5b46e0;position:relative;overflow:hidden;min-height:150px}
.destacada h3{font-family:var(--body);text-transform:none;font-size:1.3rem;line-height:1.15;font-weight:700}
.destacada p{opacity:.85;font-size:.9rem;margin-top:4px}
.destacada img{height:120px;flex:none;margin-right:-8px}
.destacada .ir{margin-top:12px;width:48px;height:48px;border-radius:50%;border:0;background:#1f1f22;color:#fff;font-size:1.3rem}
.cifras{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cifra{border-radius:22px;padding:14px;background:var(--ink);color:#231f1c;border:2px solid var(--k)}
.cifra span{display:inline-block;background:var(--k);color:#fff;border-radius:10px;padding:2px 8px;font-size:.75rem;font-weight:700}
.cifra b{display:block;font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.semana{background:var(--ink);color:#231f1c;border-radius:22px;padding:16px}
.semana h4{margin:0 0 12px;font-size:1rem}
#msgT:empty{display:none}
.barras{margin-top:28px;display:flex;align-items:flex-end;justify-content:space-between;gap:8px;height:120px}
.barras div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;font-size:.75rem;font-weight:600;color:#6b635c}
.barras i{display:block;width:100%;max-width:30px;border-radius:12px;background:#f3d3c4;min-height:10px;position:relative}
.barras i.on{background:var(--naranja)}
.barras i em{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-style:normal;font-size:.7rem;color:#231f1c}
/* tienda */
.saldo-card{border-radius:26px;padding:18px;background:var(--naranja);color:#2a0f04;display:flex;align-items:center;justify-content:space-between;overflow:hidden}
.saldo-card b{display:block;font-family:var(--display);font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
.saldo-card img{height:96px;margin:-6px -6px -18px 0}
.tabs{display:flex;gap:8px;background:var(--panel);border-radius:999px;padding:5px}
.tabs button{flex:1;border:0;border-radius:999px;padding:10px 6px;background:none;font-weight:700;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:#231f1c}
.prod{border-radius:22px;padding:16px;background:var(--ink);color:#231f1c;display:flex;flex-direction:column;gap:8px;border-left:8px solid var(--k)}
.prod .muted{color:#6b635c}
.prod h3{font-family:var(--body);text-transform:none;font-size:1.05rem;font-weight:700}
.prod .precio{display:inline-flex;align-items:center;gap:5px;background:var(--k);color:#fff;border-radius:999px;padding:3px 10px;font-weight:700;font-size:.85rem;white-space:nowrap}
.prod .btn{align-self:flex-start;font-size:.95rem;padding:9px 16px;box-shadow:none;background:#231f1c;color:#fff}
.prod .btn[disabled]{background:#d9d2cb;color:#8a827b}
.prod .btn.sec{background:transparent;color:#231f1c;border-color:#231f1c}
.prod.tv{background:#3917a8;color:#fff;border-left:0;padding:20px}
.prod.tv .muted{color:#d6ccff}
.prod.tv .btn{background:#ffb020;color:#3a2400}
.prod.tv .btn[disabled]{background:rgba(255,255,255,.18);color:#d6ccff}
.meta{height:10px;border-radius:99px;background:rgba(0,0,0,.12);overflow:hidden}
.prod.tv .meta{background:rgba(255,255,255,.2)}
.meta i{display:block;height:100%;border-radius:99px;background:#ffb020}
.cab{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
</style>
</head>
<body>
<div class="app">
  <header style="position:sticky">
    <img class="logo" src="logo-mandarinatec.png" alt="MandarinaTec" width="38" height="38">
    <div class="brand">MandarinaTec</div>
    <div id="stats" style="display:flex;gap:8px;align-items:center"></div>
    <div id="menu" class="menu" hidden></div>
  </header>
  <main id="v"></main>
  <footer>MVP v1.4.0 · 26/11/2026 · MandarinaTec</footer>
</div>
<div id="hoja" hidden role="dialog" aria-label="Detalle"></div>
<nav id="nav" hidden aria-label="Secciones"><div>
  <button data-n="mapa"><svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg>Mapa</button>
  <button data-n="tienda"><svg viewBox="0 0 24 24"><path d="M6 8h12l1 12H5L6 8zM9 8V6a3 3 0 0 1 6 0v2"/></svg>Tienda</button>
  <button data-n="guias"><svg viewBox="0 0 24 24"><path d="M5 4h9a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4zM5 17a3 3 0 0 1 3-3h9"/></svg>Mis guías</button>
  <button data-n="perfil"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Perfil</button>
</div></nav>

<script>
/* =====================================================================
   CONFIGURACIÓN · pega aquí los datos de Supabase > Project Settings > API
   La "publishable key" (o "anon key") es pública por diseño. NUNCA pongas aquí la service_role / secret key.
   ===================================================================== */
const SUPABASE_URL = "https://jjumtsblbnaqcqfvzngk.supabase.co";
const SUPABASE_KEY = "sb_publishable_TRUaOqfFxJtRKE2kpXu7fA_Foh6H2nY";

const MUNDOS=[
 {n:"Mundo Principiante",c:"#3f9a37",sub:"Lo esencial, paso a paso"},
 {n:"Mundo Intermedio",c:"#2054e5",sub:"Trucos para ahorrar tiempo"},
 {n:"Mundo Avanzado",c:"#5b3ad6",sub:"La IA a tu favor"}
];
const ERRORES={
 ya_completaste_hoy:"Ya hiciste el reto de hoy. Vuelve mañana para el siguiente.",
 reto_bloqueado:"Ese reto todavía no está abierto.",
 falta_test:"Primero haz el test de nivel.",
 sin_sesion:"Tu sesión se cerró. Entra de nuevo con tu correo.",
 solo_testers:"Esa opción es solo para el equipo de pruebas.",
 saldo_insuficiente:"Te faltan mandarinas para eso. Haz el reto de hoy y vuelve.",
 ya_desbloqueado:"Ese nivel ya lo tienes abierto.",
 guia_ya_obtenida:"Esa guía ya es tuya. Está en Mis guías.",
 cofre_bloqueado:"Todavía no llegas a ese cofre.",
 cofre_ya_abierto:"Ese cofre ya lo abriste.",
 requiere_cuenta:"Guarda tu cuenta con correo y contraseña para canjear premios.",
 premio_ya_solicitado:"Ya solicitaste ese premio. El equipo te contactará por correo.",
 maximo_protectores:"Ya tienes 2 protectores, el máximo que se puede guardar."
};
const $=s=>document.querySelector(s), V=$("#v");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mezcla=a=>a.map((v,k)=>({v,k})).sort((x,y)=>(x.k*7+3)%a.length-(y.k*7+3)%a.length||x.k-y.k);
const dias=(a,b)=>Math.round((new Date(a)-new Date(b))/864e5);     // fechas 'YYYY-MM-DD'

let sb=null, P=null, RETOS=[], HOY=null;   // P = perfil del usuario (tabla perfiles)

function dino(txt,img){return `<div class="dino-row${img==="dino-alto.webp"?" sacude":""}"><img class="cara" src="dino-cara.webp" alt="Dino"><div class="bubble" data-tw>${txt}</div></div>`}
const POSES={guia:"Dino señalando",alto:"Dino con la mano en alto",lupa:"Dino con una lupa",reto:"Dino frente a un teléfono"};
const hero=(p,cls)=>`<div class="dino-hero ${cls||""}"><img src="dino-${p}.webp" alt="${POSES[p]}"></div>`;
const MONEDA='<svg class="moneda" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13.5" r="9.5" fill="#fc5e31"/><circle cx="9" cy="11" r="2.2" fill="#fff" opacity=".35"/><ellipse cx="17" cy="4" rx="4" ry="2" transform="rotate(-30 17 4)" fill="#6ac460"/></svg>';
const QUIETO=matchMedia("(prefers-reduced-motion: reduce)").matches;
function teclea(root){                       // texto de Dino letra por letra; un toque lo completa
  if(QUIETO)return;
  root.querySelectorAll("[data-tw]:not([data-ok])").forEach(b=>{
    b.dataset.ok=1;
    const nodos=[],w=document.createTreeWalker(b,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode())nodos.push([n,n.textContent]);
    const total=nodos.reduce((a,x)=>a+x[1].length,0);if(total<2)return;
    nodos.forEach(x=>x[0].textContent="");
    const fila=b.closest(".dino-row");if(fila)fila.classList.add("habla");
    let i=0;const paso=Math.max(1,Math.round(total/90));
    const pinta=()=>{let r=i;for(const [nd,t] of nodos){nd.textContent=t.slice(0,Math.max(0,r));r-=t.length}};
    const fin=()=>{clearInterval(t);i=total;pinta();if(fila)fila.classList.remove("habla")};
    const t=setInterval(()=>{i+=paso;pinta();if(i>=total)fin()},22);
    b.addEventListener("click",fin,{once:true});
  });
}
new MutationObserver(()=>teclea(V)).observe(V,{childList:true,subtree:true});
function lluvia(n){
  if(QUIETO)return;
  const L=document.createElement("div");L.className="lluvia";L.setAttribute("aria-hidden","true");
  for(let k=0;k<(n||28);k++){const i=document.createElement("i");i.style.left=Math.random()*100+"%";i.style.animationDuration=1.6+Math.random()*1.6+"s";i.style.animationDelay=Math.random()*.6+"s";i.style.transform=`scale(${.6+Math.random()*.8})`;L.appendChild(i)}
  document.body.appendChild(L);setTimeout(()=>L.remove(),4200);
}
function cargando(t){V.innerHTML=dino(t||"Cargando…")}
function fallo(e){
  const k=(e&&e.message||"").match(/[a-z_]+/g)||[], cod=k.find(x=>ERRORES[x]);
  V.innerHTML=dino(cod?ERRORES[cod]:"Algo se trabó al conectar. Revisa tu internet y vuelve a intentar.","dino-alto.webp")+
    `<button class="btn" id="r">Volver a intentar</button>`;
  $("#r").onclick=inicio; console.error(e);
}
const rachaViva=()=>{if(!P.ultimo_dia)return P.racha;const g=dias(HOY,P.ultimo_dia);return g<=1||(g===2&&P.protectores>0)?P.racha:0};
function stats(){
  const S=$("#stats");
  if(!(P&&P.nivel_inicial!=null)){S.innerHTML="";return}
  S.innerHTML=`<div class="pill" title="Días seguidos"><i style="background:var(--amarillo)"></i>Racha ${rachaViva()}</div>
    <button class="saldo" id="saldo" title="Ir a la tienda">${MONEDA}${P.mandarinas}</button>`;
  $("#saldo").onclick=()=>vTienda();
}
let RECOMP=[], DESB=new Set(), SEC_HECHOS=new Set(), GUIAS=[], MIAS=new Set(), COFRES=[], ABIERTOS=new Set();
const costo=c=>(RECOMP.find(r=>r.codigo===c)||{}).costo||0;
const cierraMenu=()=>{};
const errTxt=(e,def)=>{const k=(e&&e.message||"").match(/[a-z_]+/g)||[];return ERRORES[k.find(x=>ERRORES[x])]||def};
const NOMBRE_CANJE={pista:"Pista",segunda:"Segunda oportunidad",nivel_secreto:"Nivel secreto",protector:"Protector de racha",guia:"Guía",premio:"Premio"};
async function canjea(codigo,reto){
  P=await rpc("canjear",{p_codigo:codigo,p_reto:reto});
  if(codigo==="nivel_secreto")DESB.add(reto);
  stats();return P;
}
function setNav(a){
  const N=$("#nav");N.hidden=!a;document.body.classList.toggle("connav",!!a);
  N.querySelectorAll("button").forEach(b=>a&&b.dataset.n===a?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current"));
  if(!a)cierraHoja();
}
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>({mapa:vMapa,tienda:vTienda,guias:vGuias,perfil:vPerfil})[b.dataset.n]());
function hoja(html){const h=$("#hoja");h.innerHTML=`<button class="x" aria-label="Cerrar">✕</button>`+html;h.hidden=false;h.querySelector(".x").onclick=cierraHoja;return h}
function cierraHoja(){$("#hoja").hidden=true}
document.addEventListener("keydown",e=>{if(e.key==="Escape")cierraHoja()});
const MON_CH=MONEDA.replace('class="moneda"','class="moneda" style="width:16px;height:16px;vertical-align:-3px"');

/* ---------- Tienda ---------- */
let TAB="premios", PREMIOS=[], SOLIC=new Set();
const TV_SVG='<svg viewBox="0 0 96 70" width="96" height="70" aria-hidden="true"><rect x="4" y="4" width="88" height="52" rx="7" fill="#1f1f22"/><rect x="10" y="10" width="76" height="40" rx="3" fill="#7cc8ff"/><path d="M10 40 34 22l16 12 12-8 24 18v6H10z" fill="#5b46e0" opacity=".55"/><rect x="34" y="58" width="28" height="5" rx="2.5" fill="#fff"/></svg>';
const num0=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,".");
function vTienda(msg){
  setNav("tienda");stats();
  const sec=RETOS.filter(r=>r.tipo==="secreto"&&!DESB.has(r.orden));
  const precio=c=>`<span class="precio">${MON_CH} ${num0(c)}</span>`;
  let cuerpo="";
  if(TAB==="premios"){
    cuerpo=PREMIOS.map(x=>{const ya=SOLIC.has(x.codigo), pct=Math.min(100,Math.round(P.mandarinas/x.costo*100));
      return `<div class="prod tv"><div class="cab"><div><div class="eyebrow" style="color:#ffb020">Premio de ${esc(x.aliado)}</div><h3 style="font-size:1.5rem">${esc(x.nombre)}</h3></div>${TV_SVG}</div>
        <p class="muted">${esc(x.descripcion)}</p>
        <div class="meta"><i style="width:${ya?100:pct}%"></i></div>
        <div class="cab"><span>${ya?"Solicitud enviada":`Tienes <b>${num0(P.mandarinas)}</b> de ${num0(x.costo)}`}</span>${precio(x.costo)}</div>
        ${ya?`<p class="muted">El equipo te contactará por correo para coordinar la entrega.</p>`
          :ANON?`<p class="muted">Guarda tu cuenta desde Perfil para poder canjear premios.</p>`
          :`<button class="btn" data-p="${x.codigo}" ${P.mandarinas<x.costo?"disabled":""}>${P.mandarinas<x.costo?`Te faltan ${num0(x.costo-P.mandarinas)}`:"Canjear premio"}</button>`}</div>`}).join("")
      ||dino("Pronto habrá premios de nuestros aliados.");
  }else if(TAB==="guias"){
    cuerpo=GUIAS.map(g=>`<div class="prod" style="--k:#2054e5"><div class="cab"><h3>${esc(g.titulo)}</h3>${precio(g.costo)}</div><span class="muted">${esc(g.resumen)}</span>
       ${MIAS.has(g.codigo)?`<button class="btn sec" data-lee="${g.codigo}">Ya es tuya · Leer</button>`
         :`<button class="btn" data-g="${g.codigo}" ${P.mandarinas<g.costo?"disabled":""}>Canjear</button>${COFRES.some(c=>c.guia_codigo===g.codigo)?`<span class="muted">También sale gratis en un cofre del mapa.</span>`:""}`}</div>`).join("")
      ||dino("Las guías todavía no están cargadas.");
  }else{
    cuerpo=RECOMP.map(r=>`<div class="prod" style="--k:#3f9a37"><div class="cab"><h3>${esc(r.nombre)}</h3>${precio(r.costo)}</div><span class="muted">${esc(r.descripcion)}</span>
       ${r.codigo==="protector"?`<button class="btn" data-c="protector" ${P.mandarinas<r.costo||P.protectores>=2?"disabled":""}>Canjear</button>${P.protectores?`<span class="muted">Tienes ${P.protectores} guardados.</span>`:""}`
        :r.codigo==="nivel_secreto"?(sec.length?sec.map(x=>`<button class="btn" data-c="nivel_secreto" data-r="${x.orden}" ${P.mandarinas<r.costo?"disabled":""}>Abrir «${esc(x.titulo)}»</button>`).join(""):`<span class="muted">Ya abriste todos los niveles secretos.</span>`)
        :`<span class="muted"><b>Se usa dentro de un reto,</b> al responder una pregunta.</span>`}</div>`).join("")+
     `<section class="card"><div class="eyebrow">Cómo ganar mandarinas</div>
       <div class="fila"><span>Cada actividad sin errores</span><b>+10</b></div><div class="fila"><span>Reto práctico hecho</span><b>+20</b></div>
       <div class="fila"><span>Terminar un mundo</span><b>+20</b></div><div class="fila"><span>Cada 7 días de racha</span><b>+15</b></div>
       <div class="fila"><span>Cofres del mapa</span><b>+15 o una guía</b></div></section>
      <section class="card"><div class="eyebrow">Historial de canjes</div><div id="hist"><p class="muted">Cargando…</p></div></section>`;
  }
  V.innerHTML=`
   <div class="saldo-card"><div><div style="font-weight:700">Tus mandarinas</div><b>${num0(P.mandarinas)}</b><span>Total ganado: ${num0(P.total_ganado)}</span></div><img src="dino-guia.webp" alt=""></div>
   <div class="tabs" role="tablist">${[["premios","Premios"],["guias","Guías"],["ayudas","Ayudas"]].map(t=>`<button role="tab" data-tab="${t[0]}" aria-selected="${TAB===t[0]}">${t[1]}</button>`).join("")}</div>
   <div id="msgT" class="err" role="status">${msg||""}</div>
   ${cuerpo}`;
  V.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;vTienda()});
  const canje=(sel,fn,ok)=>V.querySelectorAll(sel).forEach(b=>b.onclick=async()=>{b.disabled=true;
    try{await fn(b);lluvia(14);vTienda(ok(b))}catch(e){$("#msgT").textContent=errTxt(e,"No se pudo canjear. Prueba de nuevo.");b.disabled=false}});
  canje("[data-c]",b=>canjea(b.dataset.c,b.dataset.r?+b.dataset.r:null),b=>b.dataset.r?"Nivel secreto abierto. Juégalo desde el mapa.":"Listo, canjeado.");
  canje("[data-g]",async b=>{P=await rpc("canjear_guia",{p_codigo:b.dataset.g});MIAS.add(b.dataset.g)},()=>"Guía canjeada. Ya está en Mis guías.");
  canje("[data-p]",async b=>{P=await rpc("canjear_premio",{p_codigo:b.dataset.p});SOLIC.add(b.dataset.p)},()=>"Solicitud enviada. Te contactaremos por correo.");
  V.querySelectorAll("[data-lee]").forEach(b=>b.onclick=()=>vGuia(b.dataset.lee));
  if($("#hist"))sb.from("canjes").select("codigo,costo,creado").order("creado",{ascending:false}).limit(8).then(({data})=>{
    const H=$("#hist");if(!H)return;
    H.innerHTML=data&&data.length?data.map(h=>`<div class="fila"><span>${NOMBRE_CANJE[h.codigo]||h.codigo} · ${new Date(h.creado).toLocaleDateString("es")}</span><b>−${num0(h.costo)}</b></div>`).join(""):'<p class="muted">Todavía no canjeas nada.</p>'});
  window.scrollTo(0,0);
}

/* ---------- Mis guías ---------- */
function vGuias(){
  setNav("guias");stats();
  const MAIN=RETOS.filter(r=>r.tipo!=="secreto");
  V.innerHTML=`<div><div class="eyebrow">Mis guías</div><h2>Tu biblioteca de trucos</h2></div>
   ${GUIAS.length?"":dino("Las guías todavía no están cargadas. Vuelve pronto.")}
   ${GUIAS.map(g=>{const c=COFRES.find(x=>x.guia_codigo===g.codigo),r=c&&MAIN.find(x=>x.orden===c.despues_de);
     return `<div class="card" ${MIAS.has(g.codigo)?"":'style="opacity:.75"'}><h3>${esc(g.titulo)}</h3><p class="muted">${esc(g.resumen)}</p>
     ${MIAS.has(g.codigo)?`<button class="btn" data-lee="${g.codigo}">Leer</button>`
       :`<p><b>Bloqueada.</b> ${r?`Sale en el cofre después de «${esc(r.titulo)}», o canjéala`:"Canjéala"} por ${g.costo} mandarinas.</p><button class="btn sec" data-ir>Ir a la tienda</button>`}</div>`}).join("")}`;
  V.querySelectorAll("[data-lee]").forEach(b=>b.onclick=()=>vGuia(b.dataset.lee));
  V.querySelectorAll("[data-ir]").forEach(b=>b.onclick=vTienda);
  window.scrollTo(0,0);
}
async function vGuia(codigo){
  setNav("guias");
  const g=GUIAS.find(x=>x.codigo===codigo);cargando("Abriendo tu guía…");
  const {data,error}=await sb.from("guias_contenido").select("secciones").eq("codigo",codigo).single();
  if(error||!data){V.innerHTML=dino("No pude abrir esa guía. Revisa tu internet y vuelve a intentar.","dino-alto.webp")+`<button class="btn" id="s">Volver</button>`;$("#s").onclick=vGuias;return}
  V.innerHTML=`<button class="btn sec" id="s" style="align-self:flex-start">← Mis guías</button>
   <div><div class="eyebrow">Guía de MandarinaTec</div><h2>${esc(g?g.titulo:"")}</h2></div>
   <article class="card guia">${data.secciones.map(x=>`<h3>${esc(x.h)}</h3><ul>${x.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>`).join("")}</article>
   ${dino("Guárdala en la cabeza o vuelve cuando quieras: aquí se queda.")}`;
  $("#s").onclick=vGuias;window.scrollTo(0,0);
}

/* ---------- Perfil ---------- */
function vPerfil(){
  setNav("perfil");stats();
  const MAIN=RETOS.filter(r=>r.tipo!=="secreto"), desde=MAIN.filter(r=>r.mundo>=P.nivel_inicial), hechos=desde.filter(r=>r.orden<P.siguiente_reto).length;
  const pct=desde.length?Math.round(hechos/desde.length*100):0, sig=MAIN.find(r=>r.orden===P.siguiente_reto), yaHoy=P.ultimo_dia===HOY;
  const nombre=ANON?"":(P.usuario||"").replace(/^./,c=>c.toUpperCase());
  V.innerHTML=`
   <div class="hola"><img src="dino-cara.webp" alt=""><div><h2>Hola${nombre?", "+esc(nombre):""}</h2><p class="muted">Avance: ${pct}% del camino${ANON?" · Invitado":""}</p></div></div>
   <div class="destacada"><div style="flex:1"><div style="font-weight:700;opacity:.85;font-size:.85rem">${!sig?"Camino completado":yaHoy?"Listo por hoy":"Tu reto de hoy"}</div>
      <h3>${!sig?"Terminaste todos los mundos":esc(sig.titulo)}</h3><p>${!sig?"Repasa cuando quieras desde el mapa.":yaHoy?"Se abre mañana.":"Cinco minutos y sumas a tu racha."}</p>
      <button class="ir" id="irMapa" aria-label="Ir al mapa">→</button></div><img src="dino-guia.webp" alt=""></div>
   <div class="cifras"><div class="cifra" style="--k:#fc5e31"><span>Retos</span><b>${hechos}</b>completados</div>
     <div class="cifra" style="--k:#5b46e0"><span>Racha</span><b>${rachaViva()}</b>${rachaViva()===1?"día seguido":"días seguidos"}</div></div>
   <div class="semana"><h4>Tu semana</h4><div class="barras" id="sem">${"LMXJVSD".split("").map(d=>`<div><i></i>${d}</div>`).join("")}</div></div>
   <div class="cifras"><div class="cifra" style="--k:#3f9a37"><span>Mandarinas</span><b>${num0(P.mandarinas)}</b>en tu saldo</div>
     <div class="cifra" style="--k:#2054e5"><span>Guías</span><b>${MIAS.size}</b>en tu biblioteca</div></div>
   ${ANON?`<div class="card" style="border-color:var(--amarillo)"><p><b>Estás jugando como invitado.</b> Si borras el navegador o cambias de teléfono, pierdes tu racha.</p>
      <div class="ayuda"><button class="btn" id="guardar">Guardar mi avance</button><button class="btn sec" id="yaCuenta">Ya tengo cuenta</button></div></div>`
     :`<div class="card"><div class="eyebrow">Tu cuenta</div><p>${esc(P.email)}</p><button class="btn sec" id="salir">Cerrar sesión</button></div>`}
   <div class="card"><div class="eyebrow">El cielo del mapa</div><div class="seg">
     ${[["","Automático"],["dia","Día"],["noche","Noche"]].map(m=>`<button class="btn sec" data-m="${m[0]}" aria-pressed="${(MODO||"")===m[0]}">${m[1]}</button>`).join("")}</div>

async function rpc(fn,args){const {data,error}=await sb.rpc(fn,args);if(error)throw error;return Array.isArray(data)?data[0]:data}
async function cargarTodo(){
  const u=(await sb.auth.getUser()).data.user, uid=u.id; ANON=!!u.is_anonymous;
  const [p,r,h,rc,ds,it]=await Promise.all([
    sb.from("perfiles").select("*").eq("id",uid).single(),
    sb.from("retos").select("orden,mundo,titulo,pasos,tipo").order("orden"),
    sb.rpc("hoy_usuario"),
    sb.from("recompensas").select("*").order("orden"),
    sb.from("desbloqueos").select("reto_orden"),
    sb.from("intentos").select("reto_orden").eq("es_repaso",false).gte("reto_orden",100)]);
  for(const x of [p,r,h,rc,ds,it]) if(x.error)throw x.error;
  P=p.data; RETOS=r.data; HOY=h.data; RECOMP=rc.data; DESB=new Set(ds.data.map(x=>x.reto_orden)); SEC_HECHOS=new Set(it.data.map(x=>x.reto_orden));
  if(P.usuario==='usuario')P.usuario=u.email?u.email.split('@')[0]:'';
  // Tablas de la v1.3: si el parche aún no está aplicado, la app sigue funcionando sin guías ni cofres
  const opc=async q=>{try{const x=await q;return x.error?[]:x.data||[]}catch(e){return []}};
  const [g,mg,cf,ca]=await Promise.all([opc(sb.from("guias").select("*").order("orden")),opc(sb.from("guias_usuario").select("codigo")),
    opc(sb.from("cofres").select("*").order("id")),opc(sb.from("cofres_abiertos").select("cofre_id"))]);
  GUIAS=g; MIAS=new Set(mg.map(x=>x.codigo)); COFRES=cf; ABIERTOS=new Set(ca.map(x=>x.cofre_id));
  const [pr,so]=await Promise.all([opc(sb.from("premios").select("*").order("orden")),opc(sb.from("solicitudes_premio").select("codigo"))]);
  PREMIOS=pr; SOLIC=new Set(so.map(x=>x.codigo));
}

function vGuardar(despues){

      E.textContent="No pudimos guardar. Revisa tu internet y vuelve a intentar.";return}
    if(r1.data.user.email!==em){   // el proyecto exige confirmar el correo
      V.innerHTML=dino(`Te enviamos un correo a <b>${esc(em)}</b>. Confírmalo y vuelve aquí para crear tu contraseña.`)+`<button class="btn" id="s">Volver al mapa</button>`;
      $("#s").onclick=despues;return}

    ANON=false;

    lluvia();V.innerHTML=`${hero("guia","salta")}
      ${dino(`Listo, <b>${esc(P.usuario||em)}</b>. Tu avance quedó guardado. Desde cualquier teléfono entras con «Ya tengo cuenta».`)}

  const MAIN=RETOS.filter(r=>r.tipo!=="secreto"), yaHoy=P.ultimo_dia===HOY, sig=MAIN.find(r=>r.orden===P.siguiente_reto);

  if(ANON){$("#guardar").onclick=()=>vGuardar(vMapa);$("#yaCuenta").onclick=()=>vLogin(vMapa)}

  // Niveles: al tocar, se abre la hoja con el detalle
  V.querySelectorAll(".nodo").forEach(b=>b.onclick=()=>{
    const r=RETOS.find(q=>q.orden===+b.dataset.o), hecho=r.orden<P.siguiente_reto, actual=r.orden===P.siguiente_reto;
    const h=hoja(`<div class="eyebrow">Día ${num(r)} · ${MUNDOS[r.mundo].n}</div><h3>${esc(r.titulo)}</h3>
      <p class="muted">${r.pasos.length} actividades · unos 5 minutos · hasta 60 mandarinas</p>
      ${hecho?`<button class="btn" id="ir">Repasar</button>`:actual&&!yaHoy?`<button class="btn" id="ir">Empezar</button>`
        :actual?`<p>Ya hiciste el reto de hoy. Este se abre mañana.</p>`:`<p>Termina los retos anteriores para abrirlo. Uno por día.</p>`}`);
    const ir=h.querySelector("#ir"); if(ir)ir.onclick=()=>vReto(r);
  });
  // Cofres
  const hojaCofre=c=>{
    const ab=ABIERTOS.has(c.id), listo=!ab&&P.siguiente_reto>c.despues_de, g=GUIAS.find(q=>q.codigo===c.guia_codigo), r=MAIN.find(q=>q.orden===c.despues_de);
    const h=hoja(`<div class="eyebrow">Cofre de premio</div><h3>${g?"Guía: "+esc(g.titulo):"+"+c.mandarinas+" mandarinas"}</h3>
      ${g?`<p class="muted">${esc(g.resumen)}</p>`:""}
      ${ab?(g?`<button class="btn" id="lee">Leer la guía</button>`:`<p>Ya lo abriste. Las mandarinas están en tu saldo.</p>`)
        :listo?`<button class="btn" id="abre">Abrir cofre</button>`:`<p>Completa «${esc(r?r.titulo:"el reto anterior")}» para abrirlo.</p>`}<div class="err" id="msgC" role="status"></div>`);
    if(h.querySelector("#lee"))h.querySelector("#lee").onclick=()=>vGuia(g.codigo);
    if(h.querySelector("#abre"))h.querySelector("#abre").onclick=async ev=>{ev.target.disabled=true;
      try{P=await rpc("abrir_cofre",{p_cofre:c.id});ABIERTOS.add(c.id);if(g)MIAS.add(g.codigo);lluvia(26);vMapa();hojaCofre(c)}
      catch(e){h.querySelector("#msgC").textContent=errTxt(e,"No se pudo abrir. Prueba de nuevo.");ev.target.disabled=false}};
  };
  V.querySelectorAll(".cofre-btn").forEach(b=>b.onclick=()=>hojaCofre(COFRES.find(c=>c.id===+b.dataset.cofre)));
  // Dino y árboles
  let nf=0, tg=0; const D=$("#dinoMapa"), ocultaGlobo=ms=>{clearTimeout(tg);tg=setTimeout(()=>{const G=$("#globo");if(G)G.hidden=true},ms)};
  if(D)ocultaGlobo(7000);
  if(D)D.onclick=()=>{const G=$("#globo");G.innerHTML=nf===0&&rachaViva()>1?`Llevas <b>${rachaViva()} días</b> seguidos. No la sueltes.`:FRASES[nf%FRASES.length];nf++;G.hidden=false;G.removeAttribute("data-ok");G.dataset.tw="";teclea(V);ocultaGlobo(5000)};
  V.querySelectorAll(".arbol").forEach(b=>b.onclick=()=>{b.classList.remove("mueve");void b.offsetWidth;b.classList.add("mueve")});
  // Secretos
  V.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>vReto(RETOS.find(r=>r.orden===+b.dataset.s)));
  V.querySelectorAll("[data-abre]").forEach(b=>b.onclick=async()=>{b.disabled=true;
    try{await canjea("nivel_secreto",+b.dataset.abre);lluvia(16);vMapa()}
    catch(e){$("#msgSec").textContent=errTxt(e,"No se pudo abrir. Prueba de nuevo.");b.disabled=false}});
  // Dino camina desde el nivel anterior cuando avanzas
  if(D&&AVANZO&&D.animate&&!QUIETO&&+D.dataset.k>0){
    const W=D.parentElement.clientWidth, k=+D.dataset.k, lp=X[(k-1)%6]<50?80:20, la=X[k%6]<50?80:20;
    D.animate([{transform:`translate(calc(-50% + ${(lp-la)/100*W}px),calc(-50% - ${PASO}px))`},{transform:"translate(-50%,-50%)"}],{duration:900,easing:"cubic-bezier(.3,1.3,.5,1)"});
  }
  AVANZO=false;
  const nd=D||V.querySelector(".nodo.hoy,.nodo.espera"); if(nd&&nd.scrollIntoView) nd.scrollIntoView({block:"center"});
}

/* ---------- Actividades: cada una pinta en el contenedor y llama fin(sinFallos) ---------- */
const BIEN=["Exacto. Así se hace.","Esa es. Vas volando.","Correcto, sin despeinarte."];
const sigBtn=(txt,ok,fin)=>{$("#fb").innerHTML=dino(txt)+`<button class="btn" id="s" style="margin-top:14px;width:100%">Seguir</button>`;$("#s").onclick=()=>fin(ok)};
const alto=txt=>{$("#fb").innerHTML=dino(txt,"dino-alto.webp")};
const ACT={
 card(st,C,fin){
  C.innerHTML=`${hero("guia")}<div class="bubble" data-tw>${st.d}</div><button class="btn" id="s">Entendido</button>`;
  $("#s").onclick=()=>fin(null);
 },
 escena(st,C,fin){
  let n=0;
  const ROT=["guia","lupa","alto","reto"];let nd=0;
  C.innerHTML=`<div class="card"><div class="eyebrow">Dramatización</div><h3>${st.h}</h3>
    <div class="escenario"><img id="pose" src="dino-guia.webp" alt="${POSES.guia}"></div>
    <div class="escena" id="esc" aria-live="polite"></div></div>
    <div id="mor"></div><button class="btn" id="s">Empezar la escena</button>`;
  const E=$("#esc"),B=$("#s");
  B.onclick=()=>{
    if(n<st.l.length){
      const l=st.l[n++];
      E.insertAdjacentHTML("beforeend",l[0]==="a"?`<div class="linea acto">${l[1]}</div>`
        :l[0]==="d"?`<div class="linea dino-row"><img class="cara" src="dino-cara.webp" alt=""><div class="bubble" data-tw><small>${l[1]}</small>${l[2]}</div></div>`
        :`<div class="linea tu"><div class="bubble"><small>${l[1]}</small>${l[2]}</div></div>`);
      if(l[0]==="d"){const p=l[3]||ROT[nd++%4],I=$("#pose");I.src="dino-"+p+".webp";I.alt=POSES[p];I.classList.remove("pop");void I.offsetWidth;I.classList.add("pop")}
      B.textContent=n<st.l.length?"Siguiente":"¿Y la moraleja?";
      E.lastChild.scrollIntoView({block:"nearest"});
    }else if(!$("#mor").innerHTML){
      $("#mor").innerHTML=`<div class="moraleja" data-tw>${st.m}</div>`;const I=$("#pose");I.src="dino-guia.webp";I.classList.remove("pop");void I.offsetWidth;I.classList.add("pop");B.textContent="Entendido";$("#mor").scrollIntoView({block:"nearest"});
    }else fin(null);
  };
 },
 quiz(st,C,fin,pre){
  let fallo=false, salvado=false, pista=false;
  const cP=costo("pista"), cS=costo("segunda");
  C.innerHTML=`<div class="card">${pre||""}<h3>${st.q}</h3><div class="opts">${st.o.map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join("")}</div>
    ${cP&&st.o.length>2?`<div class="ayuda"><button class="btn sec" id="pista">${MONEDA} Usar pista · ${cP}</button></div>`:""}</div><div id="fb"></div>`;
  const usar=async(codigo,ok)=>{
    if(P.mandarinas<costo(codigo)){alto(`Te faltan mandarinas: tienes ${P.mandarinas} y esto cuesta ${costo(codigo)}.`);return false}
    try{await canjea(codigo,null);ok();return true}catch(e){alto("No se pudo usar ahora. Sigue sin ayuda, que tú puedes.");return false}
  };
  const P1=$("#pista");
  if(P1)P1.onclick=async()=>{
    P1.disabled=true;
    const malas=[...C.querySelectorAll(".opt:not([disabled])")].filter(o=>+o.dataset.k!==st.a);
    if(!malas.length)return;
    await usar("pista",()=>{const m=malas[Math.floor(Math.random()*malas.length)];m.classList.add("tachada");m.disabled=true;pista=true;
      $("#fb").innerHTML=dino("Te quité una opción que no es. Ahora te toca a ti.")})||(P1.disabled=false);
  };
  C.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(+b.dataset.k===st.a){
      b.classList.add("ok");C.querySelectorAll(".opt,#pista").forEach(o=>o.disabled=true);
      if(st.hueco)$("#hueco").textContent=b.textContent;
      sigBtn(fallo?"Ahora sí. Así se aprende.":salvado?"Bien recuperado. No perdiste nada.":BIEN[st.q.length%3],!fallo,fin);
    }else{
      fallo=true;b.classList.add("mal");b.disabled=true;
      alto("Alto ahí. Esa no es, y no pasa nada: nadie nace sabiendo. Prueba otra.");
      if(!salvado&&cS){
        $("#fb").insertAdjacentHTML("beforeend",`<div class="ayuda" style="margin-top:10px"><button class="btn sec" id="seg">${MONEDA} Segunda oportunidad · ${cS}</button></div>`);
        $("#seg").onclick=async()=>{$("#seg").disabled=true;await usar("segunda",()=>{fallo=false;salvado=true;$("#fb").innerHTML=dino("Hecho: este error no te descuenta. Elige otra.")})};
      }
    }
  });
 },
 completa(st,C,fin){
  ACT.quiz({q:st.s.replace("___",'<span class="hueco" id="hueco">&nbsp;</span>'),o:st.o,a:st.a,hueco:1},C,fin,'<div class="eyebrow">Completa la frase</div>');
  C.querySelector("h3").style.cssText="text-transform:none;font-family:var(--body);font-weight:600;line-height:1.5";
 },
 mito(st,C,fin){
  let n=0,limpio=true;
  const pinta=()=>{
    const it=st.items[n];
    C.innerHTML=`<div class="card"><div class="eyebrow">¿Mito o verdad? · ${n+1} de ${st.items.length}</div><p style="font-size:1.15rem;font-weight:600">${it[0]}</p>
      <div class="dos"><button class="opt" data-v="1">Verdad</button><button class="opt" data-v="0">Mito</button></div></div><div id="fb"></div>`;
    C.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const ok=(b.dataset.v==="1")===it[1];
      C.querySelectorAll(".opt").forEach(o=>{o.disabled=true;if((o.dataset.v==="1")===it[1])o.classList.add("ok")});
      if(!ok){limpio=false;b.classList.add("mal")}
      $("#fb").innerHTML=dino((ok?"<b>Correcto.</b> ":"<b>Casi.</b> Es "+(it[1]?"verdad":"mito")+". ")+it[2],ok?null:"dino-alto.webp")+`<button class="btn" id="s" style="margin-top:14px;width:100%">Seguir</button>`;
      $("#s").onclick=()=>{n++;n<st.items.length?pinta():fin(limpio)};
    });
  };
  pinta();
 },
 pares(st,C,fin){
  let sel=null,ok=0,limpio=true;
  const der=mezcla(st.p.map(x=>x[1]));
  C.innerHTML=`<div class="card"><h3>${st.h}</h3><p class="muted">Toca uno de la izquierda y luego su pareja.</p><div class="pares">
     <div>${st.p.map((x,k)=>`<button class="opt L" data-k="${k}">${x[0]}</button>`).join("")}</div>
     <div>${der.map(x=>`<button class="opt R" data-k="${x.k}">${x.v}</button>`).join("")}</div></div></div><div id="fb"></div>`;
  C.querySelectorAll(".L").forEach(b=>b.onclick=()=>{C.querySelectorAll(".L").forEach(o=>o.classList.remove("sel"));b.classList.add("sel");sel=b;$("#fb").innerHTML=""});
  C.querySelectorAll(".R").forEach(b=>b.onclick=()=>{
    if(!sel){alto("Primero toca uno de la columna izquierda.");return}
    if(sel.dataset.k===b.dataset.k){
      [sel,b].forEach(o=>{o.classList.remove("sel","mal");o.classList.add("ok");o.disabled=true});sel=null;ok++;
      if(ok===st.p.length)sigBtn("Todas las parejas armadas.",limpio,fin);
    }else{limpio=false;b.classList.remove("mal");void b.offsetWidth;b.classList.add("mal");alto("Esa pareja no cuadra. Prueba con otra.")}
  });
 },
 orden(st,C,fin){
  let va=0,limpio=true;
  C.innerHTML=`<div class="card"><h3>Ponlo en orden</h3><p class="muted">Toca los pasos del primero al último.</p>
    <div class="orden" id="ord"></div><div class="chips">${mezcla(st.o).map(m=>`<button class="opt" data-k="${m.k}">${m.v}</button>`).join("")}</div></div><div id="fb"></div>`;
  C.querySelectorAll(".chips .opt").forEach(b=>b.onclick=()=>{
    if(+b.dataset.k===va){
      va++;$("#ord").insertAdjacentHTML("beforeend",`<div><b style="color:var(--verde)">${va}.</b> ${b.textContent}</div>`);b.remove();$("#fb").innerHTML="";
      if(va===st.o.length)sigBtn("Ordenadito. Ese es el truco completo.",limpio,fin);
    }else{limpio=false;b.classList.remove("mal");void b.offsetWidth;b.classList.add("mal");alto("Ese paso va después. Piensa qué harías primero.")}
  });
 },
 prompt(st,C,fin){
  let n=0,limpio=true;
  C.innerHTML=`<div class="card"><div class="eyebrow">Juego</div><h3>Arma el prompt</h3><p class="muted">Elige la pieza buena de cada ingrediente y mira cómo se va armando.</p>
    <div class="armado" id="arm"><span class="muted">Tu prompt aparecerá aquí.</span></div><div id="slot"></div></div><div id="fb"></div>`;
  const pinta=()=>{
    const s=st.s[n];
    $("#slot").innerHTML=`<p style="font-weight:600;margin:6px 0 10px">Ingrediente ${n+1} de ${st.s.length}: ${s[0]}</p><div class="opts">${s[1].map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join("")}</div>`;
    C.querySelectorAll("#slot .opt").forEach(b=>b.onclick=()=>{
      if(+b.dataset.k===s[2]){
        if(n===0)$("#arm").innerHTML="";
        $("#arm").insertAdjacentHTML("beforeend",`<span><b>${s[0]}:</b> ${b.textContent}</span>`);n++;$("#fb").innerHTML="";
        if(n<st.s.length)pinta();else{$("#slot").innerHTML="";sigBtn("Ese prompt sí trae buena respuesta. Guárdalo.",limpio,fin)}
      }else{limpio=false;b.classList.add("mal");b.disabled=true;alto("Con esa pieza la IA tiene que adivinar. Dale más pista.")}
    });
  };
  pinta();
 },
 reto(st,C,fin){
  C.innerHTML=`${hero("reto")}
    <div class="card"><div class="eyebrow">Reto práctico</div><p>${st.r}</p><p class="muted">Hazlo ahora en tu computadora o celular. Yo te espero aquí.</p></div>
    <button class="btn" id="s">Listo, lo hice</button><button class="btn sec" id="n">Hoy no puedo, lo dejo pendiente</button>`;
  $("#s").onclick=()=>fin("reto");$("#n").onclick=()=>fin(null);
 }
};


/* ---------- Reto diario ---------- */
function vReto(R){
  setNav(null);
  const SECR=R.tipo==="secreto", MAIN=RETOS.filter(r=>r.tipo!=="secreto"), w=R.mundo, num=MAIN.indexOf(R)+1;
  let p=0, gan=0, practico=false;
  const paso=()=>{
    if(p>=R.pasos.length) return final();
    V.innerHTML=`<div style="display:flex;gap:12px;align-items:center"><button class="btn sec" id="x" aria-label="Volver al mapa">✕</button>
       <div class="barra" style="flex:1"><span style="width:${p/R.pasos.length*100}%"></span></div></div>
       <div><div class="eyebrow">${SECR?"Nivel secreto":`Día ${num} · ${MUNDOS[w].n}`}</div><h2>${esc(R.titulo)}</h2></div>
       <div id="act" style="display:flex;flex-direction:column;gap:18px"></div>`;
    $("#x").onclick=vMapa;
    const st=R.pasos[p], fn=ACT[st.k];
    if(!fn){p++;return paso()}            // tipo desconocido (error de contenido): se salta
    fn(st,$("#act"),r=>{if(r==="reto"){gan+=20;practico=true}else if(r===true)gan+=10;p++;paso()});
    window.scrollTo(0,0);
  };
  const final=async()=>{
    cargando("Guardando tu avance…");
    const antes=P.siguiente_reto, saldo=P.mandarinas;
    try{P=await rpc("completar_reto",{p_reto:R.orden,p_puntos:gan,p_practico:practico})}catch(e){return fallo(e)}
    const ganado=P.mandarinas-saldo, subio=SECR?ganado>0:P.siguiente_reto>antes, bono=Math.max(0,ganado-Math.min(gan,60));
    if(SECR&&subio)SEC_HECHOS.add(R.orden);
    stats();
    const finMundo=!SECR&&subio&&!MAIN.some(r=>r.mundo===w&&r.orden>R.orden), sigM=MUNDOS[w+1];
    if(subio)lluvia(ganado>=40?36:20);if(subio&&!SECR)AVANZO=true;
    V.innerHTML=`${hero("guia",subio?"salta":"")}
      <div><div class="eyebrow">${!subio?"Repaso terminado":SECR?"Nivel secreto completado":"Reto del día completado"}</div><h1>${finMundo?"Mundo superado":"Reto completado"}</h1></div>
      ${subio?`<div class="premio"><div><b>+${ganado}</b>mandarinas</div>${SECR?`<div><b>${P.mandarinas}</b>en tu saldo</div>`:`<div><b>${P.racha}</b>${P.racha===1?"día de racha":"días de racha"}</div>`}</div>`
             :`<p class="muted">Los repasos no suman mandarinas, pero refuerzan lo aprendido.</p>`}
      ${dino(bono?`Incluye <b>+${bono}</b> de bono${finMundo?" por terminar el mundo":""}${P.racha%7===0&&!SECR?" por tu racha de "+P.racha+" días":""}. ${finMundo&&sigM&&MAIN.some(r=>r.mundo===w+1)?`Mañana se abre el ${sigM.n}.`:""}`
            :finMundo&&sigM&&MAIN.some(r=>r.mundo===w+1)?`Terminaste el ${MUNDOS[w].n}. Mañana se abre el ${sigM.n}.`
            :SECR&&subio?"Nivel secreto completado. Tus mandarinas ya están en el saldo."
            :subio?"Eso era todo por hoy. Vuelve mañana para no perder la racha.":"Bien repasado.")}
      <button class="btn" id="s">Volver al mapa</button>`;
    $("#s").onclick=()=>ANON&&subio&&!SECR?vGuardar(vMapa):vMapa();window.scrollTo(0,0);
  };
  paso();
}

/* ---------- Arranque ---------- */
async function inicio(){
  cargando();
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(!session){P=null;return vEntrada()}
    await cargarTodo();
    P.nivel_inicial==null?vTest():vMapa();
  }catch(e){fallo(e)}
}
(function(){
  if(!window.supabase||SUPABASE_KEY.startsWith("TU_")){
    V.innerHTML=dino("Falta conectar la base de datos: pega la Project URL y la publishable key de Supabase al inicio del código.","dino-alto.webp");return}
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  let listo=false;
  sb.auth.onAuthStateChange((ev)=>{if(ev==="SIGNED_IN"&&listo)inicio()});
  inicio().then(()=>{listo=true});
})();
</script>
